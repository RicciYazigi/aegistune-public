name: CPU contracts and audits
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/verify_artifacts.py --manifest ARTIFACTS.json
      - run: python scripts/summarize_results.py --report docs/results/test200_summary.json
      - run: >-
          python -m pytest -q
          tests/test_p1_corte1.py
          tests/test_p1_integration_16_cases.py
          tests/test_p2_runner_rewards_eval.py
          tests/test_frozen_evaluation_plan.py
          tests/test_mission_intent_audit.py
          tests/test_evidence_viewer.py
